version: '3.8'

services:
  db:
    image: postgres:15
    container_name: quicksketch_db
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: quicksketch_backend
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: quicksketch_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata: