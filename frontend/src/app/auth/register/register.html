<div class="auth-container">
    <div class="left-panel">
        <h1>DISEGNA,<br>INDOVINA, VINCI!</h1>
        <div class="illustration-placeholder">
            <img src="ragazzoRegister.png" alt="Registrazione Quicksketch" class="hero-image">
        </div>
    </div>

    <div class="right-panel">
        <div class="logo-container">
            <img src="logoQuicksketch.png" alt="Logo Quicksketch" class="logo-img">
        </div>

        <h3 class="welcome-text">Unisciti alla Community!</h3>

        <form class="auth-form" (ngSubmit)="register()">
            <div class="input-group">
                <div class="input-wrapper">
                    <i class="fa-solid fa-user icon-left"></i>
                    <input type="text" placeholder="Nome Utente" name="username" [(ngModel)]="username" required>
                </div>
            </div>

            <div class="input-group">
                <div class="input-wrapper">
                    <i class="fa-solid fa-envelope icon-left"></i>
                    <input type="email" placeholder="Email" name="email" [(ngModel)]="email" required>
                </div>
            </div>

            <div class="input-group">
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock icon-left"></i>
                    <input [type]="showPassword() ? 'text' : 'password'" placeholder="Password" name="password" [(ngModel)]="password" required>
                    <i class="fa-solid icon-right"
                       [class.fa-eye]="!showPassword()"
                       [class.fa-eye-slash]="showPassword()"
                       (click)="togglePassword()">
                    </i>
                </div>
            </div>

            <button type="submit" class="btn-auth">REGISTRATI</button>
        </form>

        <div class="link-container">
            <span>Hai già un account? </span>
            <a routerLink="/login" class="link">Accedi qui</a>
        </div>
    </div>
</div>
