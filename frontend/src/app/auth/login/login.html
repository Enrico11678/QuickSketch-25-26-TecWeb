<div class="auth-container">
    <div class="left-panel">
        <h1>ACCEDI E LIBERA<br>LA TUA CREATIVITÀ</h1>
        <div class="illustration-placeholder">
            <img src="ragazzoLogin.png" alt="Illustrazione Quicksketch" class="hero-image">
        </div>
    </div>

    <div class="right-panel">
        <div class="logo-container">
            <img src="logoQuicksketch.png" alt="Logo Quicksketch" class="logo-img">
        </div>

        <h3 class="welcome-text">Bentornato!</h3>

        <form class="auth-form" (ngSubmit)="login()">
            <div class="input-group">
                <div class="input-wrapper">
                    <i class="fa-solid fa-envelope icon-left"></i>
                    <input type="email" placeholder="Email" name="email" [(ngModel)]="email" required>
                </div>
            </div>

            <div class="input-group">
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock icon-left"></i>
                    <input [type]="showPassword() ? 'text' : 'password'" placeholder="Password" name="password" [(ngModel)]="password" required>
                    <i class="fa-solid icon-right" 
                       [class.fa-eye]="!showPassword()" 
                       [class.fa-eye-slash]="showPassword()" 
                       (click)="togglePassword()">
                    </i>
                </div>
            </div>

            <button type="submit" class="btn-auth">ACCEDI</button>
        </form>

        <div class="link-container">
            <span>Non hai un account? </span>
            <a routerLink="/register" class="link">Registrati</a>
        </div>

        <div class="guest-link-container">
            <p>Vuoi solo dare un'occhiata?</p>
            <a routerLink="/dashboard" class="guest-link">Esplora la galleria come ospite ➡</a>
        </div>

    </div>
</div>
